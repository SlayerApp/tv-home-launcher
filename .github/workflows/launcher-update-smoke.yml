name: Exercise the launcher update on Android TV

on:
  push:
    branches: ['qa/launcher-update-3.8.0']

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build two versions with a disposable signing key
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          mkdir -p "$ANDROID_USER_HOME" "$RUNNER_TEMP/update-fixture"
          bash gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/update-fixture/TV-Home-Apple-Style.apk"
          python3 .github/launcher-update-smoke.py prepare
          bash gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/launcher-bootstrap.apk"
      - name: Confirm a launcher update in the Android TV installer
        shell: bash
        run: |
          set -euo pipefail
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools="$(dirname "$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)")"
          export PATH="$tools:$sdk/platform-tools:$sdk/emulator:$PATH"
          image='system-images;android-34;android-tv;x86'
          sdkmanager --install emulator platform-tools "$image"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name update-test --package "$image" --device tv_1080p --path "$ANDROID_AVD_HOME/update-test.avd" <<< "no"
          adb keygen "$ANDROID_USER_HOME/adbkey"
          export ADB_VENDOR_KEYS="$ANDROID_USER_HOME/adbkey"
          adb start-server
          emulator -avd update-test -port 5554 -no-window -no-audio -gpu swiftshader -no-snapshot -no-boot-anim > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          python3 -u -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/update-fixture" > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$emulator_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          export ANDROID_SERIAL=emulator-5554
          if ! timeout 150 adb wait-for-device; then tail -n 35 "$RUNNER_TEMP/emulator.log"; exit 1; fi
          for ((i=0; i<90; i++)); do
            [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]] || break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent KEYCODE_WAKEUP
          adb install "$RUNNER_TEMP/launcher-bootstrap.apk"
          if ! python3 .github/launcher-update-smoke.py exercise; then
            tail -n 30 "$RUNNER_TEMP/fixture.log"
            adb logcat -d -t 400 -s AndroidRuntime PackageInstaller InstallStart PackageManager
            exit 1
          fi
